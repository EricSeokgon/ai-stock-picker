[project]
name = "stock-picker"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29",
    "alembic>=1.13,<2.0",
    "anthropic>=0.40",
    "finance-datareader>=0.9",
    "apscheduler>=3.10,<4.0",
    "redis>=5.0",
    "httpx>=0.27",
    "atoma>=0.0.17",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-telegram-bot>=21.0",
    "pydantic[email]>=2.13.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgresql]>=4.0",
    "fakeredis>=2.20",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# router.py, dividends.py는 통합 테스트 전용 — 단위 테스트 omit
omit = ["*/router.py", "*/dividends.py"]

[tool.coverage.report]
fail_under = 75
omit = ["*/router.py", "*/dividends.py"]
